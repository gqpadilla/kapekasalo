<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory · Kasalo Kape Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../img/logo/cup-logo.png">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/brand.css">
</head>

<body class="bg-gata-light text-tinta font-sans antialiased">
  <div id="gate" class="min-h-screen grid place-items-center font-label uppercase tracking-wider text-sm">Checking access…</div>

  <div id="app" hidden class="min-h-screen lg:grid lg:grid-cols-[16rem_1fr]">
    <aside id="sidebar"></aside>

    <main class="px-4 sm:px-8 lg:px-10 py-8 min-w-0">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="font-label uppercase tracking-[0.25em] text-xs">Inventory</p>
          <h1 class="font-serif text-4xl sm:text-5xl leading-tight mt-1">What's on the shelf</h1>
          <p id="low-note" class="mt-2 text-sm"></p>
        </div>
        <button type="button" id="add" class="bg-banga text-papel font-label uppercase tracking-wider px-6 py-3 rounded-full border-2 border-tinta shadow-ube-sm">+ Add ingredient</button>
      </div>
      <p id="msg" role="status" hidden class="mt-4 rounded-2xl border-2 px-4 py-3 text-sm"></p>

      <div class="mt-6 bg-papel border-2 border-tinta rounded-3xl overflow-x-auto">
        <table class="w-full text-sm min-w-[42rem]">
          <thead class="font-label uppercase tracking-wider text-xs text-left">
            <tr class="border-b-2 border-tinta"><th class="py-3 pl-5 pr-3">Ingredient</th><th class="pr-3 text-right">In stock</th>
              <th class="pr-3 text-right">Alert at</th><th class="pr-3 text-right">Cost / unit</th><th class="pr-3">Used in</th><th class="pr-5"></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <h2 class="mt-10 font-label uppercase tracking-wider text-sm">Recent stock changes</h2>
      <ul id="moves" class="mt-3 bg-papel border-2 border-tinta rounded-3xl divide-y divide-tinta/15 text-sm"></ul>
    </main>
  </div>

  <dialog id="ed" class="ed" aria-labelledby="ed-title">
    <div class="flex items-center justify-between px-6 h-16 border-b-2 border-tinta">
      <h2 id="ed-title" class="font-display uppercase text-xl"></h2>
      <button type="button" data-close aria-label="Close" class="w-10 h-10 grid place-items-center rounded-full hover:bg-gata">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="px-6 py-6 grid gap-8 overflow-y-auto">
      <!-- Stock change (existing ingredients) -->
      <form id="move" class="grid gap-3" novalidate>
        <h3 class="lbl">Update stock <span id="ed-stock" class="normal-case tracking-normal font-sans"></span></h3>
        <div class="grid grid-cols-2 gap-2">
          <label class="pm"><input type="radio" name="kind" value="count" checked class="sr-only"> Counted</label>
          <label class="pm"><input type="radio" name="kind" value="delivery" class="sr-only"> Delivery in</label>
          <label class="pm"><input type="radio" name="kind" value="waste" class="sr-only"> Waste / spoiled</label>
          <label class="pm"><input type="radio" name="kind" value="adjust" class="sr-only"> Correction ±</label>
        </div>
        <label class="block"><span id="move-lbl" class="lbl"></span><input name="value" type="number" step="any" required class="inp"></label>
        <label class="block"><span class="lbl">Note</span><input name="note" class="inp" placeholder="e.g. Milk past date, 2 cartons"></label>
        <button class="bg-tinta text-gata font-label uppercase tracking-wider py-3 rounded-full">Save stock</button>
      </form>

      <!-- Details -->
      <form id="info" class="grid gap-3" novalidate>
        <h3 class="lbl">Details</h3>
        <label class="block"><span class="lbl">Name</span><input name="name" required class="inp"></label>
        <div class="grid grid-cols-3 gap-3">
          <label class="block"><span class="lbl">Unit</span><select name="unit" class="inp"><option value="g">grams</option><option value="ml">ml</option><option value="pc">pieces</option></select></label>
          <label class="block"><span class="lbl">Alert at</span><input name="low_stock_at" type="number" min="0" step="any" class="inp"></label>
          <label class="block"><span class="lbl">₱ per unit</span><input name="cost_per_unit" type="number" min="0" step="any" class="inp"></label>
        </div>
        <button class="border-2 border-tinta font-label uppercase tracking-wider py-3 rounded-full hover:bg-kalamansi">Save details</button>
      </form>

      <!-- Recipes -->
      <section id="rec" class="grid gap-3">
        <h3 class="lbl">Used in (per item sold)</h3>
        <ul id="rec-list" class="grid gap-2 text-sm"></ul>
        <form id="rec-add" class="grid grid-cols-[1fr_6rem_auto] gap-2" novalidate>
          <select name="product" class="inp !mt-0" aria-label="Menu item"></select>
          <input name="qty" type="number" min="0" step="any" class="inp !mt-0" placeholder="Qty" aria-label="Amount used">
          <button class="px-4 rounded-xl border-2 border-tinta font-label uppercase tracking-wider text-xs hover:bg-kalamansi">Add</button>
        </form>
      </section>
      <p id="ed-msg" role="alert" class="text-sm text-sili min-h-[1.25rem] -mt-4"></p>
    </div>
  </dialog>

  <style>
    .lbl { display: block; font-family: 'MADE Sunflower', sans-serif; text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; }
    .inp { display: block; width: 100%; margin-top: .3rem; padding: .6rem .8rem; background: #FFFFFF; border: 2px solid #141414; border-radius: .75rem; }
    .inp:focus { outline: none; box-shadow: 3px 3px 0 #5B3A8C; }
    .pm { text-align: center; padding: .6rem; border: 2px solid #141414; border-radius: .9rem; background: #FFFFFF; cursor: pointer; font-size: .85rem; }
    .pm:has(:checked) { background: #F2B732; font-weight: 700; }
    .pm:has(:focus-visible) { box-shadow: 3px 3px 0 #5B3A8C; }
    .ed { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(520px, 100vw); max-width: 100vw; padding: 0; border: 0;
      border-left: 2px solid #141414; background: #FAF6EF; color: #141414; }
    .ed[open] { display: flex; flex-direction: column; }
    .ed::backdrop { background: rgba(20, 20, 20, .55); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="admin.js"></script>
  <script>
    const { sb } = KK;
    const { esc, dateTime } = KKAdmin;
    const $ = s => document.querySelector(s);
    const UNIT = { g: 'g', ml: 'ml', pc: 'pcs' };
    const REASON = { sale: 'Sold', refund: 'Refund', purchase: 'Delivery', waste: 'Waste', count: 'Count', adjust: 'Adjusted' };
    let ings = [], recipes = [], products = [], cur = null;

    const qty = (n, u) => `${Number(n).toLocaleString('en-PH', { maximumFractionDigits: 2 })} ${UNIT[u]}`;
    const flash = (text, ok = true) => {
      const m = $('#msg'); m.hidden = false; m.textContent = text;
      m.className = `mt-4 rounded-2xl border-2 px-4 py-3 text-sm ${ok ? 'border-jeepney bg-jeepney-soft' : 'border-sili bg-sili-soft'}`;
      clearTimeout(flash.t); flash.t = setTimeout(() => { m.hidden = true; }, 4000);
    };
    const pname = id => products.find(p => p.id === id)?.name || id;

    async function load() {
      const [a, b, c, d] = await Promise.all([
        sb.from('ingredients').select('*').eq('active', true).order('name'),
        sb.from('recipes').select('*'),
        sb.from('products').select('id, name').order('name'),
        sb.from('stock_movements').select('*, ingredients(name, unit)').order('created_at', { ascending: false }).limit(30),
      ]);
      const err = [a, b, c, d].find(r => r.error)?.error;
      if (err) return flash(KK.message(err), false);
      [ings, recipes, products] = [a.data, b.data, c.data];
      const low = ings.filter(i => +i.stock <= +i.low_stock_at);
      $('#low-note').innerHTML = low.length ? `<b class="text-sili">${low.length} running low:</b> ${low.map(i => esc(i.name)).join(', ')}` : 'Everything is stocked.';
      $('#rows').innerHTML = ings.map(i => {
        const isLow = +i.stock <= +i.low_stock_at, uses = recipes.filter(r => r.ingredient_id === i.id);
        return `<tr class="border-b border-tinta/15">
          <td class="py-3 pl-5 pr-3 font-bold">${esc(i.name)}</td>
          <td class="pr-3 text-right whitespace-nowrap"><span class="${isLow ? 'bg-sili text-papel px-2 py-0.5 rounded-full font-bold' : ''}">${qty(i.stock, i.unit)}</span></td>
          <td class="pr-3 text-right text-tinta/70 whitespace-nowrap">${qty(i.low_stock_at, i.unit)}</td>
          <td class="pr-3 text-right">₱${Number(i.cost_per_unit).toFixed(2)}</td>
          <td class="pr-3 text-xs text-tinta/70">${uses.length ? uses.map(r => esc(pname(r.product_id))).join(', ') : '—'}</td>
          <td class="pr-5 text-right"><button type="button" data-id="${i.id}" class="font-label uppercase tracking-wider text-xs px-4 py-2 rounded-full border-2 border-tinta hover:bg-kalamansi">Update</button></td>
        </tr>`;
      }).join('') || '<tr><td colspan="6" class="py-6 px-5 text-tinta/70">No ingredients yet.</td></tr>';
      $('#moves').innerHTML = d.data.map(m => `
        <li class="px-5 py-2.5 flex flex-wrap gap-x-4 gap-y-0.5">
          <span class="w-36 text-tinta/70">${dateTime(m.created_at)}</span>
          <span class="flex-1 min-w-[10rem]"><b>${esc(m.ingredients?.name)}</b> · ${REASON[m.reason]}${m.note ? ` <span class="text-tinta/70">— ${esc(m.note)}</span>` : ''}</span>
          <span class="font-bold ${m.change < 0 ? 'text-sili' : 'text-jeepney'}">${m.change > 0 ? '+' : ''}${qty(m.change, m.ingredients?.unit)}</span>
        </li>`).join('') || '<li class="px-5 py-4 text-tinta/70">No stock changes yet.</li>';
      if (cur) cur = ings.find(i => i.id === cur.id) || null;
    }

    // ---------- Editor ----------
    const LABEL = { count: 'How much is on the shelf now', delivery: 'How much arrived', waste: 'How much was thrown out', adjust: 'Change (use − to take out)' };
    const syncMove = () => { const k = $('#move').elements.kind.value; $('#move-lbl').textContent = `${LABEL[k]}${cur ? ` (${UNIT[cur.unit]})` : ''}`; };
    $('#move').addEventListener('change', syncMove);

    function renderRecipes() {
      const uses = recipes.filter(r => r.ingredient_id === cur.id);
      $('#rec-list').innerHTML = uses.map(r => `<li class="flex items-center gap-3 rounded-xl border-2 border-tinta bg-papel px-3 py-2">
          <span class="flex-1">${esc(pname(r.product_id))}</span><b>${qty(r.qty, cur.unit)}</b>
          <button type="button" data-unuse="${esc(r.product_id)}" class="text-tinta/70 hover:text-sili" aria-label="Stop using in ${esc(pname(r.product_id))}">✕</button></li>`).join('')
        || '<li class="text-tinta/70">Not linked to any menu item, so sales won\'t take it out of stock.</li>';
      $('#rec-add').elements.product.innerHTML = products.filter(p => !uses.some(r => r.product_id === p.id))
        .map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
    }

    function open(i) {
      cur = i || null;
      $('#ed-title').textContent = i ? i.name : 'New ingredient';
      $('#move').hidden = $('#rec').hidden = !i;
      $('#move').reset(); syncMove();
      $('#ed-stock').textContent = i ? `· now ${qty(i.stock, i.unit)}` : '';
      const f = $('#info').elements;
      f.name.value = i?.name || ''; f.unit.value = i?.unit || 'g'; f.low_stock_at.value = i?.low_stock_at ?? ''; f.cost_per_unit.value = i?.cost_per_unit ?? '';
      f.unit.disabled = !!i;   // recipes and the ledger are in this unit
      $('#ed-msg').textContent = '';
      if (i) renderRecipes();
      $('#ed').showModal();
    }
    $('#add').addEventListener('click', () => open(null));
    $('#rows').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) open(ings.find(i => i.id == b.dataset.id)); });
    $('#ed').addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target === $('#ed')) $('#ed').close(); });
    const edFail = err => { $('#ed-msg').textContent = typeof err === 'string' ? err : KK.message(err); };

    $('#move').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target.elements, kind = f.kind.value, v = Number(f.value.value), note = f.note.value.trim();
      if (f.value.value === '' || !Number.isFinite(v) || (kind !== 'adjust' && v < 0) || (kind !== 'count' && v === 0)) return edFail('Type an amount.');
      if (kind !== 'count' && !note) return edFail('Add a short note so the log makes sense later.');
      // Quick top-ups without a purchase order go through 'adjust' with a positive amount.
      const { data, error } = await sb.rpc('adjust_stock', { p_ingredient: cur.id, p_reason: kind === 'delivery' ? 'adjust' : kind,
        p_value: kind === 'delivery' ? Math.abs(v) : v, p_note: kind === 'delivery' ? `Delivery: ${note}` : note || null });
      if (error) return edFail(error);
      $('#ed').close(); flash(`${data.name} is now at ${qty(data.stock, data.unit)}.`); load();
    });

    $('#info').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target.elements, row = { name: f.name.value.trim(), low_stock_at: Number(f.low_stock_at.value) || 0, cost_per_unit: Number(f.cost_per_unit.value) || 0 };
      if (!row.name) return edFail('Give the ingredient a name.');
      if (row.low_stock_at < 0 || row.cost_per_unit < 0) return edFail('Amounts can\'t be negative.');
      const { error } = cur ? await sb.from('ingredients').update(row).eq('id', cur.id)
                            : await sb.from('ingredients').insert({ ...row, unit: f.unit.value });
      if (error) return edFail(error);
      $('#ed').close(); flash(cur ? `${row.name} saved.` : `${row.name} added. Use "Update" → Counted to set its stock.`); load();
    });

    $('#rec-add').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target.elements, q = Number(f.qty.value);
      if (!f.product.value) return edFail('Every menu item already uses this.');
      if (!(q > 0)) return edFail('Type how much one item uses.');
      const { error } = await sb.from('recipes').insert({ product_id: f.product.value, ingredient_id: cur.id, qty: q });
      if (error) return edFail(error);
      f.qty.value = ''; $('#ed-msg').textContent = '';
      await load(); renderRecipes();
    });
    $('#rec-list').addEventListener('click', async e => {
      const b = e.target.closest('[data-unuse]'); if (!b) return;
      const { error } = await sb.from('recipes').delete().eq('product_id', b.dataset.unuse).eq('ingredient_id', cur.id);
      if (error) return edFail(error);
      await load(); renderRecipes();
    });

    (async () => {
      await KKAdmin.start('inventory');
      await load();
    })();
  </script>
</body>
</html>
