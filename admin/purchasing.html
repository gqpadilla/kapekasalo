<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchasing · Kasalo Kape Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../img/logo/cup-logo.png">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../css/brand.css">
</head>

<body class="bg-gata-light text-tinta font-sans antialiased">
  <div id="gate" class="min-h-screen grid place-items-center font-label uppercase tracking-wider text-sm">Checking access…</div>

  <div id="app" hidden class="min-h-screen lg:grid lg:grid-cols-[16rem_1fr]">
    <aside id="sidebar"></aside>

    <main class="px-4 sm:px-8 lg:px-10 py-8 min-w-0">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="font-label uppercase tracking-[0.25em] text-xs">Purchasing</p>
          <h1 class="font-serif text-4xl sm:text-5xl leading-tight mt-1">Orders to suppliers</h1>
        </div>
        <button type="button" id="new-po" class="bg-banga text-papel font-label uppercase tracking-wider px-6 py-3 rounded-full border-2 border-tinta shadow-ube-sm">+ New purchase order</button>
      </div>
      <p id="msg" role="status" hidden class="mt-4 rounded-2xl border-2 px-4 py-3 text-sm"></p>

      <ul id="pos" class="mt-6 grid gap-3"></ul>

      <div class="mt-10 flex items-center justify-between">
        <h2 class="font-label uppercase tracking-wider text-sm">Suppliers</h2>
        <button type="button" id="new-sup" class="text-sm underline underline-offset-4 hover:text-banga">+ Add supplier</button>
      </div>
      <ul id="sups" class="mt-3 grid sm:grid-cols-2 xl:grid-cols-3 gap-3"></ul>
    </main>
  </div>

  <!-- New purchase order -->
  <dialog id="po-ed" class="ed" aria-labelledby="po-title">
    <form id="po-form" class="flex flex-col h-full" novalidate>
      <div class="flex items-center justify-between px-6 h-16 border-b-2 border-tinta shrink-0">
        <h2 id="po-title" class="font-display uppercase text-xl">New purchase order</h2>
        <button type="button" data-close aria-label="Close" class="w-10 h-10 grid place-items-center rounded-full hover:bg-gata">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-6 py-6 grid gap-5 content-start">
        <label class="block"><span class="lbl">Supplier</span><select name="supplier" class="inp"></select></label>
        <fieldset>
          <legend class="lbl mb-2">Items</legend>
          <div class="grid grid-cols-[1fr_5.5rem_5.5rem_auto] gap-2 text-xs text-tinta/70 mb-1"><span>Ingredient</span><span>Qty</span><span>₱ per unit</span><span></span></div>
          <ul id="po-lines" class="grid gap-2"></ul>
          <button type="button" id="po-add-line" class="mt-2 text-sm underline underline-offset-4 hover:text-banga">+ Add a line</button>
        </fieldset>
        <label class="block"><span class="lbl">Notes</span><input name="notes" class="inp" placeholder="e.g. Deliver Tuesday morning"></label>
        <p class="font-bold">Total: <span id="po-total">₱0</span></p>
        <p id="po-msg" role="alert" class="text-sm text-sili min-h-[1.25rem]"></p>
      </div>
      <div class="shrink-0 border-t-2 border-tinta bg-gata px-6 py-4 flex gap-3">
        <button class="flex-1 bg-banga text-papel font-label uppercase tracking-wider py-3.5 rounded-full border-2 border-tinta">Place order</button>
        <button type="button" data-close class="px-6 font-label uppercase tracking-wider text-sm rounded-full hover:bg-papel">Cancel</button>
      </div>
    </form>
  </dialog>

  <!-- Supplier -->
  <dialog id="sup-ed" class="box" aria-labelledby="sup-title">
    <form id="sup-form" class="p-6 grid gap-3" novalidate>
      <h2 id="sup-title" class="font-display uppercase text-xl">Supplier</h2>
      <label class="block"><span class="lbl">Name</span><input name="name" required class="inp"></label>
      <label class="block"><span class="lbl">Contact person</span><input name="contact" class="inp"></label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="lbl">Phone</span><input name="phone" type="tel" class="inp"></label>
        <label class="block"><span class="lbl">Email</span><input name="email" type="email" class="inp"></label>
      </div>
      <label class="block"><span class="lbl">Notes</span><input name="notes" class="inp"></label>
      <p id="sup-msg" role="alert" class="text-sm text-sili min-h-[1.25rem]"></p>
      <div class="flex gap-3">
        <button class="flex-1 bg-tinta text-gata font-label uppercase tracking-wider py-3 rounded-full">Save</button>
        <button type="button" data-close class="px-5 font-label uppercase tracking-wider text-sm">Cancel</button>
      </div>
    </form>
  </dialog>

  <style>
    .lbl { display: block; font-family: 'MADE Sunflower', sans-serif; text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; }
    .inp { display: block; width: 100%; margin-top: .3rem; padding: .6rem .8rem; background: #FFFFFF; border: 2px solid #141414; border-radius: .75rem; }
    .inp:focus { outline: none; box-shadow: 3px 3px 0 #5B3A8C; }
    .ed { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(560px, 100vw); max-width: 100vw; padding: 0; border: 0;
      border-left: 2px solid #141414; background: #FAF6EF; color: #141414; }
    .box { width: min(28rem, calc(100vw - 2rem)); border: 2px solid #141414; border-radius: 1.5rem; background: #FAF6EF; color: #141414; padding: 0; }
    .ed::backdrop, .box::backdrop { background: rgba(20, 20, 20, .55); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="admin.js"></script>
  <script>
    const { sb } = KK;
    const { esc, dateTime } = KKAdmin;
    const $ = s => document.querySelector(s);
    const UNIT = { g: 'g', ml: 'ml', pc: 'pcs' };
    const ST = { ordered: ['Ordered', 'bg-kalamansi-soft'], draft: ['Draft', 'bg-gata'], received: ['Received', 'bg-jeepney-soft'], cancelled: ['Cancelled', 'bg-sili-soft'] };
    let sups = [], ings = [], pos = [], editingSup = null;

    // Costs can have centavos (₱0.08 per gram), so don't round them the way KK.peso does.
    const money = n => '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const poTotal = po => po.purchase_order_items.reduce((a, i) => a + i.qty * i.unit_cost, 0);
    const flash = (text, ok = true) => {
      const m = $('#msg'); m.hidden = false; m.textContent = text;
      m.className = `mt-4 rounded-2xl border-2 px-4 py-3 text-sm ${ok ? 'border-jeepney bg-jeepney-soft' : 'border-sili bg-sili-soft'}`;
      clearTimeout(flash.t); flash.t = setTimeout(() => { m.hidden = true; }, 4000);
    };

    async function load() {
      const [a, b, c] = await Promise.all([
        sb.from('suppliers').select('*').order('name'),
        sb.from('ingredients').select('id, name, unit, cost_per_unit').eq('active', true).order('name'),
        sb.from('purchase_orders').select('*, suppliers(name), purchase_order_items(qty, unit_cost, ingredients(name, unit))').order('created_at', { ascending: false }).limit(40),
      ]);
      const err = [a, b, c].find(r => r.error)?.error;
      if (err) return flash(KK.message(err), false);
      [sups, ings, pos] = [a.data, b.data, c.data];

      $('#pos').innerHTML = pos.map(po => `
        <li class="bg-papel border-2 border-tinta rounded-2xl p-4">
          <div class="flex flex-wrap items-center gap-3">
            <b class="font-display text-xl">PO #${po.id}</b>
            <span class="font-label uppercase tracking-wider text-xs px-2.5 py-1 rounded-full border-2 border-tinta ${ST[po.status][1]}">${ST[po.status][0]}</span>
            <span class="text-sm">${esc(po.suppliers?.name)} · ${dateTime(po.created_at)}${po.received_at ? ` · received ${dateTime(po.received_at)}` : ''}</span>
            <b class="ml-auto">${money(poTotal(po))}</b>
          </div>
          <ul class="mt-2 text-sm text-tinta/80">${po.purchase_order_items.map(i => `<li>${Number(i.qty)} ${UNIT[i.ingredients.unit]} ${esc(i.ingredients.name)} @ ${money(i.unit_cost)}</li>`).join('')}</ul>
          ${po.notes ? `<p class="mt-1 text-xs text-tinta/70">${esc(po.notes)}</p>` : ''}
          ${['draft', 'ordered'].includes(po.status) ? `<div class="mt-3 flex gap-3">
            <button type="button" data-receive="${po.id}" class="font-label uppercase tracking-wider text-xs px-4 py-2 rounded-full border-2 border-tinta bg-tinta text-gata hover:bg-banga">Received · add to stock</button>
            <button type="button" data-cancel="${po.id}" class="text-xs underline underline-offset-4 hover:text-sili">Cancel order</button></div>` : ''}
        </li>`).join('') || '<li class="text-sm text-tinta/70">No purchase orders yet.</li>';

      $('#sups').innerHTML = sups.map(s => `
        <li class="bg-papel border-2 border-tinta rounded-2xl p-4 text-sm">
          <div class="flex justify-between gap-2"><b>${esc(s.name)}</b><button type="button" data-sup="${s.id}" class="text-xs underline underline-offset-4 hover:text-banga">Edit</button></div>
          ${[s.contact, s.phone, s.email].filter(Boolean).map(esc).join(' · ') || '<span class="text-tinta/60">No contact details</span>'}
          ${s.notes ? `<p class="text-xs text-tinta/70 mt-1">${esc(s.notes)}</p>` : ''}
        </li>`).join('') || '<li class="text-sm text-tinta/70">No suppliers yet.</li>';
    }

    // ---------- Purchase orders ----------
    const line = () => `
      <li class="grid grid-cols-[1fr_5.5rem_5.5rem_auto] gap-2 items-center">
        <select data-ing class="inp !mt-0" aria-label="Ingredient">${ings.map(i => `<option value="${i.id}">${esc(i.name)} (${UNIT[i.unit]})</option>`).join('')}</select>
        <input data-qty type="number" min="0" step="any" class="inp !mt-0" aria-label="Quantity">
        <input data-cost type="number" min="0" step="any" class="inp !mt-0" aria-label="Cost per unit">
        <button type="button" data-remove class="px-2 text-tinta/60 hover:text-sili" aria-label="Remove line">✕</button>
      </li>`;
    const lines = () => [...document.querySelectorAll('#po-lines li')].map(li => ({
      ingredient_id: Number(li.querySelector('[data-ing]').value), qty: Number(li.querySelector('[data-qty]').value), unit_cost: Number(li.querySelector('[data-cost]').value) }));
    const prefill = li => { li.querySelector('[data-cost]').value = ings.find(i => i.id == li.querySelector('[data-ing]').value)?.cost_per_unit ?? ''; };
    const addLine = () => { $('#po-lines').insertAdjacentHTML('beforeend', line()); prefill($('#po-lines').lastElementChild); };
    const total = () => { $('#po-total').textContent = money(lines().reduce((a, l) => a + (l.qty || 0) * (l.unit_cost || 0), 0)); };

    $('#new-po').addEventListener('click', () => {
      if (!sups.length) return flash('Add a supplier first.', false);
      $('#po-form').reset();
      $('#po-form').elements.supplier.innerHTML = sups.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      $('#po-lines').innerHTML = ''; addLine(); total();
      $('#po-msg').textContent = '';
      $('#po-ed').showModal();
    });
    $('#po-add-line').addEventListener('click', () => { addLine(); total(); });
    $('#po-lines').addEventListener('change', e => { if (e.target.matches('[data-ing]')) prefill(e.target.closest('li')); total(); });
    $('#po-lines').addEventListener('input', total);
    $('#po-lines').addEventListener('click', e => { if (e.target.closest('[data-remove]')) { e.target.closest('li').remove(); total(); } });

    $('#po-form').addEventListener('submit', async e => {
      e.preventDefault();
      const items = lines(), f = e.target.elements;
      if (!items.length) return ($('#po-msg').textContent = 'Add at least one item.');
      if (items.some(l => !(l.qty > 0) || !(l.unit_cost >= 0) || Number.isNaN(l.unit_cost))) return ($('#po-msg').textContent = 'Every line needs a quantity above 0 and a cost.');
      if (new Set(items.map(l => l.ingredient_id)).size < items.length) return ($('#po-msg').textContent = 'Each ingredient should appear once.');
      const { data: po, error } = await sb.from('purchase_orders').insert({ supplier_id: Number(f.supplier.value), status: 'ordered', notes: f.notes.value.trim() || null }).select().single();
      if (error) return ($('#po-msg').textContent = KK.message(error));
      const r = await sb.from('purchase_order_items').insert(items.map(l => ({ ...l, po_id: po.id })));
      if (r.error) {   // don't leave an empty order behind
        await sb.from('purchase_orders').delete().eq('id', po.id);
        return ($('#po-msg').textContent = KK.message(r.error));
      }
      $('#po-ed').close(); flash(`PO #${po.id} placed.`); load();
    });

    $('#pos').addEventListener('click', async e => {
      const rec = e.target.closest('[data-receive]'), can = e.target.closest('[data-cancel]');
      if (rec) {
        if (!confirm(`Mark PO #${rec.dataset.receive} as received? This adds the items to stock and records the cost as an expense.`)) return;
        rec.disabled = true;
        const { error } = await sb.rpc('receive_purchase_order', { p_po: Number(rec.dataset.receive) });
        if (error) { rec.disabled = false; return flash(KK.message(error), false); }
        flash(`PO #${rec.dataset.receive} received. Stock updated.`); load();
      }
      if (can) {
        if (!confirm(`Cancel PO #${can.dataset.cancel}?`)) return;
        const { error } = await sb.from('purchase_orders').update({ status: 'cancelled' }).eq('id', can.dataset.cancel);
        if (error) return flash(KK.message(error), false);
        load();
      }
    });

    // ---------- Suppliers ----------
    function openSup(s) {
      editingSup = s || null;
      const f = $('#sup-form').elements;
      for (const k of ['name', 'contact', 'phone', 'email', 'notes']) f[k].value = s?.[k] || '';
      $('#sup-title').textContent = s ? 'Edit supplier' : 'New supplier';
      $('#sup-msg').textContent = '';
      $('#sup-ed').showModal();
    }
    $('#new-sup').addEventListener('click', () => openSup(null));
    $('#sups').addEventListener('click', e => { const b = e.target.closest('[data-sup]'); if (b) openSup(sups.find(s => s.id == b.dataset.sup)); });
    $('#sup-form').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target.elements, row = Object.fromEntries(['name', 'contact', 'phone', 'email', 'notes'].map(k => [k, f[k].value.trim() || null]));
      if (!row.name) return ($('#sup-msg').textContent = 'Give the supplier a name.');
      if (row.email && !f.email.checkValidity()) return ($('#sup-msg').textContent = 'That email doesn\'t look right.');
      const { error } = editingSup ? await sb.from('suppliers').update(row).eq('id', editingSup.id) : await sb.from('suppliers').insert(row);
      if (error) return ($('#sup-msg').textContent = KK.message(error));
      $('#sup-ed').close(); load();
    });

    document.addEventListener('click', e => { const d = e.target.closest('dialog'); if (d && (e.target.closest('[data-close]') || e.target === d)) d.close(); });

    (async () => {
      await KKAdmin.start('purchasing');
      await load();
    })();
  </script>
</body>
</html>
